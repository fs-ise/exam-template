_subdirectory: template
_answers_file: .copier-answers.yml
_tasks:
  - "python .copier_generate_tasks.py"

course:
  type: str
  help: Course
  choices:
    IT Security Management: IT Security Management
    Analytics and Big Data: Analytics and Big Data
    Introduction to Programming: Introduction to Programming
    New/custom course: custom

custom_course_name:
  type: str
  help: Course name
  when: "{{ course == 'custom' }}"
  validator: "{% if not custom_course_name | trim %}Please enter a course name.{% endif %}"

programming_variant:
  type: str
  help: Examination type
  when: "{{ course == 'Introduction to Programming' }}"
  choices:
    Excel: Excel
    Python: Python

semester:
  type: str
  help: Semester or term
  default: "{% set month = '%m' | strftime | int %}{% set year = '%Y' | strftime | int %}{% if month >= 4 and month <= 9 %}Winter Semester {{ year }}{% else %}Summer Semester {{ year + 1 if month >= 10 else year }}{% endif %}"

number_of_questions:
  type: int
  help: Number of questions/problems (for the cover-page scoring table)
  default: "{% if course == 'IT Security Management' %}9{% elif course == 'Introduction to Programming' and programming_variant == 'Python' %}5{% else %}4{% endif %}"
  validator: "{% if number_of_questions < 1 or number_of_questions > 12 %}Choose between 1 and 12.{% endif %}"

total_points:
  type: int
  help: Maximum points
  default: "{% if course == 'IT Security Management' %}120{% elif course == 'Introduction to Programming' and programming_variant == 'Excel' %}40{% elif course == 'Introduction to Programming' and programming_variant == 'Python' %}80{% else %}60{% endif %}"
  validator: "{% if total_points < number_of_questions %}Must be at least the number of questions ({{ number_of_questions }}).{% endif %}"
